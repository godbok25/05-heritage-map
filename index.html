<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국가지정유산 지도 · 국보와 보물</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#24282c; --sub:#6b6862; --line:#e4e1da; --bg:#ffffff; --wash:#f6f4ef;
  --gukbo:#528285;   /* 국보: 단청색 (타임라인과 동일) */
  --bomul:#8c887f;   /* 보물: 웜그레이 (지도 위 대비를 위해 타임라인 #96938c보다 한 단계 어둡게) */
  --panel:360px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex}
#panel{width:var(--panel);height:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);z-index:2}
#map{flex:1;height:100%;background:#f1efea}
header{padding:24px 20px 16px}
h1{font-family:"Noto Serif KR",serif;font-size:23px;line-height:1.3;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.lead{margin:0;color:var(--sub);font-size:13px;line-height:1.55}
.block{padding:12px 20px;border-top:1px solid var(--line)}
.block h2{font-size:12px;font-weight:600;color:var(--sub);margin:0 0 8px}
.types{display:flex;gap:8px}
.type{flex:1;display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;user-select:none}
.type input{position:absolute;opacity:0;pointer-events:none}
.type .sw{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px currentColor}
.type b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.type:has(input:not(:checked)){opacity:.4}
.type:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px}
select,input[type=search]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#count{font-size:12px;color:var(--sub);padding:8px 20px;border-top:1px solid var(--line)}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
#list li{padding:10px 20px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;gap:2px 10px;align-items:baseline}
#list li:hover,#list li:focus-visible,#list li.on{background:var(--wash);outline:none}
#list .dot{width:8px;height:8px;border-radius:50%;align-self:center;grid-row:span 3}
#list .nm{font-size:14px;font-weight:600;line-height:1.35}
#list .yr{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#list .meta{grid-column:2 / 4;font-size:12px;color:var(--sub)}
#list .distance{grid-column:2;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#list button.go{grid-column:3;justify-self:end;align-self:center;font:inherit;font-size:11px;white-space:nowrap;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
#list button.go:hover{background:var(--wash)}
#list button.go:disabled{opacity:.65;cursor:wait}
.location-actions{display:flex;gap:8px;flex-wrap:nowrap}
.location-actions button{flex:1;min-width:0;white-space:nowrap;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.location-actions button:disabled{opacity:.65;cursor:wait}
.location-actions button[aria-pressed="true"]{border-color:var(--gukbo);background:var(--gukbo);color:#fff;font-weight:600}
#msg{min-height:1.4em;margin-top:7px;font-size:12px;color:var(--sub);line-height:1.4}
.route-distance-label,.route-destination-label{white-space:nowrap;border-radius:6px;padding:4px 7px;font:600 12px Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 1px 5px rgba(0,0,0,.25)}
.route-distance-label{background:#fff;color:var(--ink)}
.route-destination-label{background:#fff;color:#3478c5}
footer{padding:10px 20px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--sub);line-height:1.5}

/* 개별 핀: 국보는 크게, 보물은 작게 */
.hpin{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.25);transition:transform .12s}
.hpin.g{background:var(--gukbo)} .hpin.b{background:var(--bomul)}
.hpin.hot{transform:scale(1.45)}
@media (prefers-reduced-motion:reduce){.hpin{transition:none}}

/* 묶음(클러스터): 바깥 고리가 국보 비율을 나타냄 */
.hcl{border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hcl span{background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}

/* 마우스 오버 미리보기 */
.leaflet-tooltip.peek{padding:0;border:0;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.22);background:#fff;pointer-events:auto;white-space:normal}
.leaflet-tooltip.peek::before{display:block;position:absolute;width:auto;height:auto;border:0;margin:0;background:transparent;pointer-events:auto}
.leaflet-tooltip-top.peek::before,.leaflet-tooltip-bottom.peek::before{left:0;right:0;height:16px}
.leaflet-tooltip-top.peek::before{bottom:-16px}
.leaflet-tooltip-bottom.peek::before{top:-16px}
.leaflet-tooltip-left.peek::before,.leaflet-tooltip-right.peek::before{top:0;bottom:0;width:16px}
.leaflet-tooltip-left.peek::before{right:-16px}
.leaflet-tooltip-right.peek::before{left:-16px}
.peek .ph{width:220px;height:150px;background:#ece9e3;border-radius:10px 10px 0 0;overflow:hidden;position:relative}
.peek .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:200% 100%;animation:sh 1.1s linear infinite}
.peek .ph.done::after,.peek .ph.fail::after{display:none}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){.peek .ph::after{animation:none}}
.peek .ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .18s}
.peek .ph.done img{opacity:1}
.peek .ph.fail{display:grid;place-items:center;color:var(--sub);font-size:12px}
.peek .tx{padding:9px 12px 11px;width:220px}
.peek .tg{display:inline-block;color:#fff;font-size:11px;border-radius:4px;padding:1px 6px;margin-bottom:4px}
.peek .nm{font-family:"Noto Serif KR",serif;font-size:14px;font-weight:700;line-height:1.35;color:var(--ink)}
.peek .mt{font-size:12px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
.peek .popgo{width:100%;margin-top:9px;padding:7px 10px;border:0;border-radius:7px;background:var(--gukbo);color:#fff;font:600 13px Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;cursor:pointer}
.peek .popgo:disabled{opacity:.7;cursor:wait}
.map-toast{position:absolute;z-index:1000;left:50%;bottom:24px;transform:translate(-50%,8px);max-width:calc(100% - 32px);padding:9px 14px;border-radius:8px;background:rgba(36,40,44,.92);color:#fff;font-size:13px;text-align:center;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none}
.map-toast.visible{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  body{flex-direction:column-reverse}
  #panel{width:100%;height:44%;border-right:0;border-top:1px solid var(--line)}
  header{padding:12px 16px 8px} h1{font-size:18px} .lead,footer{display:none}
  .block{padding:8px 16px} #count{padding:6px 16px} #list li{padding:9px 16px}
  .peek .ph{width:190px;height:128px} .peek .tx{width:190px}
  :root{padding-bottom:env(safe-area-inset-bottom,0px)}
}
</style>
</head>
<body>
<aside id="panel">
  <header>
    <h1>국가지정유산 지도</h1>
    <p class="lead">국보와 보물 840건의 위치입니다. 점에 마우스를 올리면 사진이 보이고, 휴대폰에서는 점을 누르면 됩니다.</p>
  </header>
  <div class="block">
    <h2>종목</h2>
    <div class="types">
      <label class="type" style="color:var(--gukbo)"><input type="checkbox" value="0" checked><span class="sw" style="background:var(--gukbo)"></span><span style="color:var(--ink)">국보</span><b id="n0" style="color:var(--ink)">0</b></label>
      <label class="type" style="color:var(--bomul)"><input type="checkbox" value="1" checked><span class="sw" style="background:var(--bomul)"></span><span style="color:var(--ink)">보물</span><b id="n1" style="color:var(--ink)">0</b></label>
    </div>
  </div>
  <div class="block">
    <h2>지역과 지도 스타일</h2>
    <div class="row">
      <select id="region" aria-label="지역"><option value="">전체 지역</option></select>
      <select id="style" aria-label="지도 스타일"></select>
    </div>
  </div>
  <div class="block">
    <input id="q" type="search" placeholder="명칭 또는 지역 검색 (예: 불국사, 경주)" aria-label="국가유산 검색">
  </div>
    <div class="block">
      <div class="location-actions">
        <button id="locate" type="button">내 위치</button>
        <button id="nearby" type="button" aria-pressed="false">가까운 순 정렬</button>
      </div>
      <div id="msg" role="status" aria-live="polite"></div>
    </div>
    <div id="count"></div>
    <ul id="list"></ul>
    <footer>자료: 국가유산청 국가지정유산 공간정보·오픈API. 지정번호는 2021년 11월 폐지되어 참고용으로만 표기합니다.<br>경로 데이터 © OpenStreetMap contributors, Valhalla</footer>
</aside>
<div id="map" role="region" aria-label="국가지정유산 지도"></div>

function fallbackRouteCurve(from, to){
  const project = point => L.CRS.EPSG3857.project(L.latLng(point.lat, point.lng));
  const start = project(from), end = project(to);
  const dx = end.x - start.x, dy = end.y - start.y;
  const length = Math.hypot(dx, dy) || 1;
  const control = L.point((start.x + end.x) / 2 - dy / length * length * .25,
    (start.y + end.y) / 2 + dx / length * length * .25);
  const samples = [];
  for (let i = 0; i <= 60; i++){
    const t = i / 60, oneMinusT = 1 - t;
    const point = L.point(
      oneMinusT * oneMinusT * start.x + 2 * oneMinusT * t * control.x + t * t * end.x,
      oneMinusT * oneMinusT * start.y + 2 * oneMinusT * t * control.y + t * t * end.y
    );
    samples.push(L.CRS.EPSG3857.unproject(point));
  }
  return samples;
}
function decodePolyline6(encoded){
  const coordinates = [];
  let index = 0, latitude = 0, longitude = 0;
  const readValue = () => {
    let result = 0, shift = 0, byte;
    do {
      if (index >= encoded.length) throw new Error('Valhalla 경로 좌표가 잘렸습니다.');
      byte = encoded.charCodeAt(index++) - 63;
      if (byte < 0 || byte > 63 || shift > 30) throw new Error('Valhalla 경로 좌표 형식이 올바르지 않습니다.');
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);
    return result & 1 ? ~(result >> 1) : result >> 1;
  };
  while (index < encoded.length){
    latitude += readValue();
    longitude += readValue();
    coordinates.push(L.latLng(latitude / 1e6, longitude / 1e6));
  }
  return coordinates;
}
function simplifyProjectedRoute(projected){
  if (projected.length <= 2) return projected.map(point => L.CRS.EPSG3857.unproject(point));
  let tolerance = 15, simplified = L.LineUtil.simplify(projected, tolerance);
  while (simplified.length > 800 && tolerance < 100000){
    tolerance *= 2;
    simplified = L.LineUtil.simplify(projected, tolerance);
  }
  if (simplified.length > 800){
    const bounded = [];
    for (let i = 0; i < 800; i++)
      bounded.push(simplified[Math.round(i * (simplified.length - 1) / 799)]);
    simplified = bounded;
  }
  return simplified.map(point => L.CRS.EPSG3857.unproject(point));
}
function decodeRouteGeometry(legs, from, to){
  if (!Array.isArray(legs) || !legs.length) throw new Error('Valhalla 경로 좌표가 없습니다.');
  const points = [];
  legs.forEach((leg, index) => {
    if (typeof leg.shape !== 'string') throw new Error('Valhalla 경로 형식이 올바르지 않습니다.');
    const decoded = decodePolyline6(leg.shape);
    if (!decoded.length) throw new Error('Valhalla 경로 좌표가 없습니다.');
    points.push(...(index ? decoded.slice(1) : decoded));
  });
  points.unshift(L.latLng(from.lat, from.lng));
  points.push(L.latLng(to.lat, to.lng));
  const projected = points.map(point => L.CRS.EPSG3857.project(point));
  const simplified = simplifyProjectedRoute(projected);
  simplified[0] = L.latLng(from.lat, from.lng);
  simplified[simplified.length - 1] = L.latLng(to.lat, to.lng);
  return simplified;
}
function routeCumulativeLengths(points){
  const lengths = [0];
  for (let i = 1; i < points.length; i++)
    lengths.push(lengths[i - 1] + straightDistanceKm(points[i - 1], points[i]));
  return lengths;
}
function routePointAtDistance(points, cumulative, target){
  let low = 0, high = cumulative.length - 1;
  while (low < high){
    const mid = Math.floor((low + high) / 2);
    if (cumulative[mid] < target) low = mid + 1;
    else high = mid;
  }
  const end = Math.max(1, low), start = end - 1;
  const segmentLength = cumulative[end] - cumulative[start];
  const ratio = segmentLength ? (target - cumulative[start]) / segmentLength : 0;
  return {
    index:start,
    point:L.latLng(
      points[start].lat + (points[end].lat - points[start].lat) * ratio,
      points[start].lng + (points[end].lng - points[start].lng) * ratio
    )
  };
}
function animateRoute(runId, points, totalDistance, duration, straightFallback){

  if (straightFallback) lineStyle.dashArray = '8 8';
  routeLine = L.polyline([points[0]], lineStyle).addTo(map);
  const labelIcon = L.divIcon({
    className:'',
    html:`<div class="route-distance-label">${straightFallback ? '직선거리 기준 · ' : ''}0.0km</div>`,
    iconAnchor:[0, 0]
  });
  routeProgressMarker = L.marker(points[0], {
    icon:labelIcon, keyboard:false, interactive:false, pane:'routePane', zIndexOffset:100
  }).addTo(map);

  return new Promise(resolve => {
    routeAnimationResolve = resolve;
    const finish = () => {
      if (runId !== routeRunId) return resolve(false);
      routeAnimationFrame = null;
      routeLine.setLatLngs(points);
      routeProgressMarker.setLatLng(points[points.length - 1]);
      const finalText = straightFallback
        ? `직선거리 기준 · ${formatKm(totalDistance)}km`
        : `${formatKm(totalDistance)}km · 자동차 약 ${formatDuration(duration)}`;
      routeProgressMarker.getElement().firstElementChild.textContent = finalText;
      routeDestinationMarker = L.marker(points[points.length - 1], {
        keyboard:false,
        interactive:false,
        pane:'routePane',
        zIndexOffset:100,
        icon:L.divIcon({className:'', html:'<div class="route-destination-label">도착</div>', iconAnchor:[0, 0]})
      }).addTo(map);
      routeAnimationResolve = null;
      resolve(true);

    if (reduceMotion){ finish(); return; }
    const startedAt = performance.now();
    const drawFrame = now => {
      if (runId !== routeRunId) return resolve(false);
      const animationDuration = 1600 + Math.min(1600, totalDistance * 4);
      const progress = Math.min(1, (now - startedAt) / animationDuration);
      const eased = progress < .5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
      const {index, point} = routePointAtDistance(points, cumulative, pathLength * eased);
      const visiblePoints = points.slice(0, index + 1);
      visiblePoints.push(point);
      routeLine.setLatLngs(visiblePoints);
      routeProgressMarker.setLatLng(point);
      const label = routeProgressMarker.getElement()?.firstElementChild;
      if (label) label.textContent = `${straightFallback ? '직선거리 기준 · ' : ''}${formatKm(totalDistance * eased)}km`;
      if (progress < 1) routeAnimationFrame = requestAnimationFrame(drawFrame);

  });

async function startRoute(id){

    message.textContent = '먼저 [내 위치]를 눌러 주세요';
    showRouteToast('먼저 내 위치를 눌러 주세요');
    return;
  }
  routeRunId++;
  const runId = routeRunId;
  clearRoute();
  const h = DATA[id];
  if (!h) return;
  const from = {lat:userPosition.lat, lng:userPosition.lng};
  const to = {lat:h.lat, lng:h.lng};
  const straightDistance = straightDistanceKm(from, to);
  const cacheKey = routeCacheKey(h.id);
  const cachedGeometry = routeGeometryCache.get(cacheKey);
  activeRouteId = h.id;
  activeRouteLabel = '경로 불러오는 중…';
  updateRouteButtons(h.id, true, activeRouteLabel);
  let routeDistance = straightDistance, routeTime = 0, straightFallback = false;
  let routePoints = null;
  let timeoutId = 0;
  try {
    if (cachedGeometry){
      routeDistance = cachedGeometry.distance;
      routeTime = cachedGeometry.time;
      routePoints = cachedGeometry.points;
    } else {
      const controller = new AbortController();
      routeController = controller;
      timeoutId = setTimeout(() => controller.abort(), 8000);
      const response = await fetch(`${VALHALLA_URL}/route`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:controller.signal,
        body:JSON.stringify({
          locations:[{lat:from.lat, lon:from.lng},{lat:to.lat, lon:to.lng}],
          costing:'auto',
          units:'kilometers'
        })
      });
      if (!response.ok) throw new Error(`Valhalla HTTP ${response.status}`);
      const data = await response.json();
      const summary = data?.trip?.summary;
      if (!summary || !Number.isFinite(summary.length) || !Number.isFinite(summary.time)){
        throw new Error('Valhalla 경로 응답에 요약 정보가 없습니다.');
      }
      routeDistance = summary.length;
      routeTime = summary.time;
      routePoints = decodeRouteGeometry(data.trip.legs, from, to);
      routeGeometryCache.set(cacheKey, {
        points:routePoints,
        distance:routeDistance,
        time:routeTime

      distanceCache.set(cacheKey, {kind:'route', distance:routeDistance, time:routeTime});
      decorateList();
    }
    if (runId !== routeRunId) return;
    message.textContent = '';
  } catch (error) {
    if (runId !== routeRunId) return;
    straightFallback = true;
    routeDistance = straightDistance;
    routePoints = fallbackRouteCurve(from, to);
    message.textContent = '경로를 불러오지 못했어요 · 직선거리 기준';

    clearTimeout(timeoutId);

  if (runId !== routeRunId) return;
  try {
    activeRouteLabel = '경로 표시 중…';
    updateRouteButtons(h.id, true, activeRouteLabel);
    const bounds = L.latLngBounds(routePoints);
    let beginAnimation;
    const animationStarted = new Promise(resolve => {
      beginAnimation = resolve;
      routeStartResolve = resolve;
    });
    let started = false;
    const begin = () => {
      if (started || runId !== routeRunId) return;
      started = true;
      if (routeMoveEndHandler) map.off('moveend', routeMoveEndHandler);
      routeMoveEndHandler = null;
      routeStartResolve = null;
      beginAnimation();

    const initialCenter = map.getCenter(), initialZoom = map.getZoom();
    routeMoveEndHandler = begin;

    if (initialZoom === map.getZoom() && initialCenter.equals(map.getCenter()))

    if (runId !== routeRunId) return;

      updateRouteButtons(h.id, false);

}

function decorateList(){

    const h = DATA[+li.dataset.id];
    const straight = straightDistanceKm(userPosition, h);
    const cached = distanceCache.get(routeCacheKey(h.id));
    if (cached?.kind === 'route'){
      output.textContent = `도로 약 ${formatKm(cached.distance)}km · 자동차 약 ${formatDuration(cached.time)}`;
    } else {
      if (cached?.kind === 'no-route'){
        output.textContent = '도로 경로 없음';
      } else {
        output.textContent = `직선 약 ${formatKm(straight)}km`;
      }
    }
  });
}
function scheduleRouteQueue(){
  clearTimeout(routeTimer);
  routeTimer = setTimeout(dispatchRouteQueue, ROUTE_DEBOUNCE_MS);
}
async function fetchRouteBatch(ids){
  const requestedLocationKey = locationKey;
  const position = userPosition;
  ids.forEach(id => inFlightRouteIds.add(id));
  activeRouteRequests++;
  updateLocationButton();
  try {
    const response = await fetch(`${VALHALLA_URL}/sources_to_targets`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sources:[{lat:position.lat, lon:position.lng}],
        targets:ids.map(id => ({lat:DATA[id].lat, lon:DATA[id].lng})),
        costing:'auto',
        units:'kilometers'
      })
    });
    if (!response.ok) throw new Error(`Valhalla HTTP ${response.status}`);
    const data = await response.json();
    const results = data?.sources_to_targets?.[0];
    if (!Array.isArray(results)) throw new Error('Valhalla matrix 응답 형식이 올바르지 않습니다.');
    if (locationKey === requestedLocationKey){
      ids.forEach((id, index) => {
        const result = results[index];
        distanceCache.set(routeCacheKey(id),
          result && Number.isFinite(result.distance) && Number.isFinite(result.time)
            ? {kind:'route', distance:result.distance, time:result.time}
            : {kind:'no-route'});
      });
    }
  } catch (error) {
    if (locationKey === requestedLocationKey){
      ids.forEach(id => distanceCache.set(routeCacheKey(id), {kind:'no-route'}));
      const detail = error instanceof Error ? error.message : String(error);
      message.textContent = `도로 경로를 계산하지 못했습니다 (${detail}).`;
    }
  } finally {
    ids.forEach(id => inFlightRouteIds.delete(id));
    activeRouteRequests--;
    if (locationKey === requestedLocationKey) decorateList();
    updateLocationButton();
    if (pendingRouteIds.size) scheduleRouteQueue();
  }
}
function dispatchRouteQueue(){
  routeTimer = 0;
  while (activeRouteRequests < 2 && pendingRouteIds.size){
    const ids = [];
    const rowOrder = new Map([...list.querySelectorAll('li')].map((li, index) => [+li.dataset.id, index]));
    const queuedIds = [...pendingRouteIds].sort((a,b) =>
      (rowOrder.get(a) ?? Infinity) - (rowOrder.get(b) ?? Infinity));
    for (const id of queuedIds){
      if (distanceCache.has(routeCacheKey(id))){
        pendingRouteIds.delete(id);
        continue;
      }
      if (inFlightRouteIds.has(id)) continue;
      pendingRouteIds.delete(id);
      const h = DATA[id];
      if (h && straightDistanceKm(userPosition, h) <= ROUTE_DISTANCE_LIMIT_KM) ids.push(id);
      if (ids.length === ROUTE_BATCH_SIZE) break;
    }
    if (!ids.length) break;
    fetchRouteBatch(ids);
  }
  updateLocationButton();
}
function observeVisibleRows(){
  distanceObserver?.disconnect();
  pendingRouteIds.clear();
  if (!userPosition){ updateLocationButton(); return; }
  distanceObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = +entry.target.dataset.id, h = DATA[id];
      if (h && straightDistanceKm(userPosition, h) <= ROUTE_DISTANCE_LIMIT_KM &&
          !distanceCache.has(routeCacheKey(id))) pendingRouteIds.add(id);
    });
    if (pendingRouteIds.size) scheduleRouteQueue();
    updateLocationButton();
  }, {root:list, threshold:0});
  list.querySelectorAll('li').forEach(li => distanceObserver.observe(li));
}
function locateUser(){
  if (!navigator.geolocation){
    message.textContent = '이 브라우저에서는 위치 정보를 사용할 수 없습니다.';
    return;
  }
  locating = true;
  message.textContent = '현재 위치를 확인하고 있습니다.';
  updateLocationButton();
  navigator.geolocation.getCurrentPosition(position => {
    const nextPosition = {lat:position.coords.latitude, lng:position.coords.longitude};
    const nextKey = roundedLocationKey(nextPosition);
    if (locationKey && locationKey !== nextKey) distanceCache.clear();
    userPosition = nextPosition;
    locationKey = nextKey;
    if (locationMarker) locationMarker.setLatLng([nextPosition.lat, nextPosition.lng]);
    else {
      locationMarker = L.circleMarker([nextPosition.lat, nextPosition.lng], {
        radius:8, color:'#fff', weight:3, fillColor:'#3478c5', fillOpacity:.95
      }).bindTooltip('내 위치').addTo(map);
    }
    map.setView([nextPosition.lat, nextPosition.lng], Math.max(map.getZoom(), 12));
    locating = false;
    message.textContent = '현재 위치에서 각 유산까지의 거리입니다.';
    if (sortMode === 'near'){
      render(false);
      list.scrollTop = 0;
    } else {
      decorateList();
      observeVisibleRows();
    }
    updateLocationButton();
  }, error => {
    const messages = {
      1:'위치 권한이 거부되었습니다. 브라우저에서 위치 권한을 허용해 주세요.',
      2:'현재 위치를 확인할 수 없습니다. 위치 설정을 확인해 주세요.',
      3:'위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.'
    };
    locating = false;
    message.textContent = messages[error.code] || '현재 위치를 가져오지 못했습니다. 다시 시도해 주세요.';
    updateLocationButton();
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}
function sortDistance(h){
  const cached = distanceCache.get(routeCacheKey(h.id));
  return cached?.kind === 'route' ? cached.distance : straightDistanceKm(userPosition, h);
}
function toggleNearbySort(){
  if (!userPosition){
    message.textContent = '먼저 [내 위치]를 눌러 주세요';
    return;
  }
  sortMode = sortMode === 'near' ? 'default' : 'near';
  updateNearbyButton();
  render(false);
  list.scrollTop = 0;
}
function render(fit){
  const vis = DATA.filter(visible);
  cluster.clearLayers();
  cluster.addLayers(vis.map(h => markers.get(h.id)));
  hidePeek();

  const ul = document.getElementById('list'); ul.innerHTML = '';
  const frag = document.createDocumentFragment();
  const ordered = sortMode === 'near'
    ? vis.slice().sort((a,b) => sortDistance(a) - sortDistance(b) || defaultOrder(a,b))
    : vis.slice().sort(defaultOrder);
  ordered.forEach(h => {
    const li = document.createElement('li'); li.tabIndex = 0; li.dataset.id = h.id;
    li.innerHTML = `<span class="dot" style="background:${COLOR[h.cat]}"></span>
      <span class="nm">${h.name}</span><span class="yr"></span>
      <span class="meta">${CAT[h.cat]} · ${place(h)}</span>
      <span class="distance"></span><button class="go" type="button" data-route-id="${h.id}" aria-label="길찾기 ${h.name}"${activeRouteId === h.id ? ' disabled' : ''}>${activeRouteId === h.id ? activeRouteLabel : '길찾기'}</button>`;
    li.querySelector('.go').addEventListener('click', e => {
      e.stopPropagation();
      startRoute(h.id);
    });
    frag.appendChild(li);
  });
  ul.appendChild(frag);
  const g = vis.filter(h => h.cat === 0).length;
  document.getElementById('count').textContent = `표시 중 ${vis.length}건 (국보 ${g}, 보물 ${vis.length - g})`;
  decorateList();
  observeVisibleRows();
  if (fit && vis.length) map.fitBounds(L.latLngBounds(vis.map(h => [h.lat, h.lng])).pad(.08), {maxZoom:14});
}
document.getElementById('n0').textContent = DATA.filter(h => h.cat === 0).length;
document.getElementById('n1').textContent = DATA.filter(h => h.cat === 1).length;
document.querySelectorAll('.type input').forEach(i => i.addEventListener('change', () => render(false)));
regionSel.addEventListener('change', () => render(true));
let qt; document.getElementById('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => render(false), 180); });

// 목록 → 지도: 누르면 해당 유산이 보이도록 확대하고 미리보기를 고정
const list = document.getElementById('list');
document.getElementById('locate').addEventListener('click', locateUser);
nearbyButton.addEventListener('click', toggleNearbySort);
updateNearbyButton();
function goTo(id){
  const m = markers.get(+id); if (!m) return;
  list.querySelector('li.on')?.classList.remove('on');
  list.querySelector(`li[data-id="${id}"]`)?.classList.add('on');
  cluster.zoomToShowLayer(m, () => { showPeek(m); pinned = true; });
}
list.addEventListener('click', e => { const li = e.target.closest('li'); if (li) goTo(li.dataset.id); });
list.addEventListener('keydown', e => {
  if (e.target.closest('.go')) return;
  const li = e.target.closest('li'); if (li && e.key === 'Enter') goTo(li.dataset.id);
});
// 목록에 마우스를 올리면 사진을 미리 받아 두어, 지도에서 열 때 바로 보이게 함
list.addEventListener('mouseover', e => {
  const li = e.target.closest('li'); if (!li) return;
  const h = DATA[+li.dataset.id];
  if (h.img && !loaded.has(h.img) && !failed.has(h.img)){
    const im = new Image(); im.referrerPolicy = 'no-referrer';
    im.onload = () => loaded.add(h.img); im.onerror = () => failed.add(h.img); im.src = h.img;
  }
});

render(false);
</script>
</body>
